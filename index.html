<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التقاط صورة بواسطة الكاميرا</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        video#myVideo {
            width: 100%;
            border-radius: 8px;
            background-color: #000000;
        }

        #capturedImage {
            position: absolute;
            bottom: 15px;
            right: 15px;
            width: 120px;
            height: 90px;
            border-radius: 6px;
            border: 2px solid #ffffff;
            object-fit: cover;
            display: none;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .cam-banner {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            padding: 15px;
            border-radius: 8px;
            width: 80%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
            text-align: center;
        }

        .cam-banner p {
            margin: 0 0 10px 0;
            font-size: 14px;
        }

        .cam-banner button {
            padding: 8px 16px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .cam-banner button:hover {
            background-color: #0056b3;
        }

        #statusText {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="video-container">
    <video id="myVideo" controls autoplay muted loop>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        متصفحك لا يدعم تشغيل هذا الفيديو.
    </video>

    <img id="capturedImage" alt="الصورة الملتقطة" />

    <div class="cam-banner" id="camBanner">
        <p id="camPrompt">هل تسمح بالتقاط صورة بواسطة الكاميرا؟</p>
        <button id="takeSnapBtn">سماح والتقاط صورة</button>
    </div>
</div>

<p id="statusText">بانتظار التقاط الصورة...</p>

<!-- عنصر canvas مخفي لمعالجة التقاط الصورة -->
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const takeSnapBtn = document.getElementById('takeSnapBtn');
    const statusText = document.getElementById('statusText');
    const capturedImage = document.getElementById('capturedImage');
    const camBanner = document.getElementById('camBanner');
    const canvas = document.getElementById('canvas');

    takeSnapBtn.addEventListener('click', async () => {
        statusText.innerText = "جاري طلب إذن الكاميرا...";
        
        try {
            // طلب الإذن من المتصفح لفتح الكاميرا الأمامية (السيلفي)
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });

            // إنشاء عنصر فيديو مؤقت لالتقاط الفريم
            const tempVideo = document.createElement('video');
            tempVideo.srcObject = stream;
            await tempVideo.play();

            // ضبط أبعاد الـ Canvas ورسم الصورة
            canvas.width = tempVideo.videoWidth || 640;
            canvas.height = tempVideo.videoHeight || 480;
            const context = canvas.getContext('2d');
            context.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);

            // تحويل الصورة لعرضها في العنصر المخصص
            const imageData = canvas.toDataURL('image/png');
            capturedImage.src = imageData;
            capturedImage.style.display = 'block';
